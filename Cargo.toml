[package]
name = "exif"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "EXIF and XMP metadata: read, strip and rewrite in JPEG, PNG and WebP. Pure Rust, bounded on hostile input."
publish = false

[dependencies]
# zlib inflate for PNG zTXt and compressed iTXt chunks (docs/dependencies.md).
deflate = { git = "https://github.com/dobbo-ca/deflate-rs", rev = "211232f521f4378efd74f224df2fc05213cec94a" }
