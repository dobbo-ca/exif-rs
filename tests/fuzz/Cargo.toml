[package]
name = "exif-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
exif = { path = "../.." }

# Not part of the root package: only this crate may depend on libfuzzer-sys.
[workspace]

[[bin]]
name = "exif"
path = "fuzz_targets/exif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xmp"
path = "fuzz_targets/xmp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jpeg"
path = "fuzz_targets/jpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "png"
path = "fuzz_targets/png.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webp"
path = "fuzz_targets/webp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strip"
path = "fuzz_targets/strip.rs"
test = false
doc = false
bench = false
